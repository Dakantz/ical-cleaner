version: "3.4"
services:
  api:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      PORT: 80
      FLASK_RUN_PORT: 80
      MONGODB_CONN: mongodb://root:benediktfooder@mongodb:27017/
    labels:
      # Traefik configuration, Hostname needs to be changed
      - traefik.http.routers.ical-wrapper-http.rule=Host(`ical-wrapper.hafen.dakantz.at`)
      - traefik.http.routers.ical-wrapper-http.entrypoints=http
      - traefik.http.services.ical-wrapper.loadbalancer.server.port=80

    networks:
      - web
      - internal
networks:
  web:
    external: true
  internal:
    external: false